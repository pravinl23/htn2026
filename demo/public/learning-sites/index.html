<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost cross-site learning fixture</title>
    <style>
      body { margin: 0; background: #f6f7fb; color: #1d2330; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(660px, calc(100% - 40px)); margin: 56px auto; padding: 36px; background: white; border: 1px solid #dfe3ec; border-radius: 18px; box-shadow: 0 16px 50px #24304a18; }
      .eyebrow { color: #6b5cff; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
      h1 { margin: 8px 0 28px; }
      label { display: grid; gap: 8px; margin: 20px 0; font-weight: 650; }
      input, select { box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #b8c0d0; border-radius: 9px; background: white; font: inherit; }
      .choices { display: flex; gap: 24px; }
      .choices label { display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; }
      .choices input { width: auto; }
      button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 9px; background: #3226a8; color: white; font: 700 15px system-ui; }
      small { color: #647084; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow" id="surface"></div>
      <h1 id="title">Application details</h1>
      <form id="fixture-form">
        <label>First name <input id="first-name" name="firstName" autocomplete="given-name" /></label>
        <fieldset>
          <legend id="question"></legend>
          <div class="choices" id="work-auth"></div>
        </fieldset>
        <small>This is a synthetic fixture. Submit is locked and never executed by the test.</small><br />
        <button type="submit">Submit application</button>
      </form>
    </main>
    <script>
      const site = location.hostname.split(".")[0];
      const configs = {
        greenhouse: {
          title: "Greenhouse-style application",
          question: "Are you legally authorized to work in the United States for any employer?",
          yes: "gh-yes", no: "gh-no"
        },
        amazon: {
          title: "Amazon Jobs-style application",
          question: "Are you authorized to work in the United States?",
          yes: "amazon-authorized", no: "amazon-not-authorized"
        },
        airbnb: {
          title: "Airbnb Careers-style application",
          question: "Are you legally authorized to work in the U.S.?",
          yes: "airbnb-y", no: "airbnb-n"
        }
      };
      const config = configs[site] || configs.greenhouse;
      document.querySelector("#surface").textContent = site;
      document.querySelector("#title").textContent = config.title;
      document.querySelector("#question").textContent = config.question;
      const choices = document.querySelector("#work-auth");
      for (const [value, label] of [[config.no, "No"], [config.yes, "Yes"]]) {
        const id = `work-auth-${label.toLowerCase()}`;
        const wrapper = document.createElement("label");
        wrapper.htmlFor = id;
        const input = document.createElement("input");
        input.type = "radio";
        input.id = id;
        input.name = "workAuthorization";
        input.value = value;
        input.required = true;
        wrapper.append(input, label);
        choices.append(wrapper);
      }
      document.querySelector("#fixture-form").addEventListener("submit", (event) => event.preventDefault());
    </script>
  </body>
</html>
