<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 454" width="760" height="454" role="img" aria-labelledby="t d">
<title id="t">Ghost provider benchmark</title>
<desc id="d">Decision latency and streamed draft latency per provider, measured 2026-09-20 02:50 UTC. The same numbers are in the table in bench-providers.md.</desc>
<style>
  svg { --surface: #fcfcfb; --text: #0b0b0b; --text2: #52514e; --grid: #e6e5e0; --series: #2a78d6; }
