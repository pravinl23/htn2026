<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ghost options</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3C9.4 3 5 7.9 5 14.2V28l3.7-2.6 3.6 2.6 3.7-2.6 3.7 2.6 3.6-2.6L27 28V14.2C27 7.9 22.6 3 16 3Z" />
          <circle cx="12" cy="14" r="2" />
          <circle cx="20" cy="14" r="2" />
        </svg>
        <div class="masthead-text">
          <h1>Ghost</h1>
          <p>Predicts your next action. Press <kbd>Tab</kbd> to accept.</p>
        </div>
        <div id="server-status" class="masthead-status"></div>
      </header>
      <div id="onboarding"></div>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Options sections"></nav>
      <main id="panels"></main>
      <footer class="muted">
        Locked actions (submit, send, pay, delete) always need an explicit Enter or click.
        <button type="button" id="show-onboarding" class="link">How Ghost works</button>
      </footer>
    </div>
    <script src="options.js"></script>
  </body>
</html>
